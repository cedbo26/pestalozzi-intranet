name: Build & Deploy Quartz (with password)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build Quartz avec Node 22 (exigé par Quartz 4.5.x)
      - name: Setup Node (for Quartz)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update npm (required by Quartz)
        run: npm i -g npm@latest

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Build Quartz
        run: npx --yes quartz build

      - name: Check password secret (no leak)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "${STATICRYPT_PASSWORD:-}" ]; then
            echo "::error::STATICRYPT_PASSWORD secret is missing"; exit 1
          fi
          echo "✅ STATICRYPT_PASSWORD is set (hidden)."

      # Bascule en Node 20 uniquement pour le chiffrement (compat Staticrypt)
      - name: Switch Node (for encryption)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install StatiCrypt
        run: npm i -g staticrypt@3.5.4

      - name: Encrypt ALL HTML with StatiCrypt (dir → mv)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔎 Searching HTML files in ./public …"
          mapfile -d '' FILES < <(find public -type f -name "*.html" -print0)
          echo "📄 Found ${#FILES[@]} HTML file(s)."
          for f in "${FILES[@]}"; do
            tmpdir="$(mktemp -d)"
            staticrypt "$f" -d "$tmpdir" --short --salt "$(openssl rand -hex 16)" -p "$STATICRYPT_PASSWORD"
            mv "$tmpdir/$(basename "$f")" "$f"
            rmdir "$tmpdir"
          done

      - name: Verify encryption (password prompt present)
        run: |
          if grep -qiE '<input[^>]*type="password"' public/index.html; then
            echo "✅ index.html appears encrypted."
          else
            echo "❌ index.html does not look encrypted"
            echo "---- First 80 lines ----"
            head -n 80 public/index.html || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
